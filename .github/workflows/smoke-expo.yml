name: smoke-expo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: pack brand into a tarball
        id: pack
        run: |
          set -euxo pipefail
          npm pack
          TGZ=$(ls capsarmory-brand-*.tgz | head -1)
          echo "tgz=$GITHUB_WORKSPACE/$TGZ" >> "$GITHUB_OUTPUT"
      - name: scratch expo project
        run: |
          set -euxo pipefail
          mkdir -p /tmp/scratch-expo
          cd /tmp/scratch-expo
          npx --yes create-expo-app@latest . --template blank-typescript --yes
          npm install --silent "${{ steps.pack.outputs.tgz }}"
          cat > test-resolution.mjs <<'EOF'
          import tokens from "@capsarmory/brand/manifest" with { type: "json" };
          import { DarkPalette } from "@capsarmory/brand/tokens/dark";
          if (!tokens.schemaVersion) throw new Error("manifest missing schemaVersion");
          if (!DarkPalette.gold) throw new Error("DarkPalette.gold missing");
          console.log("ok rn-expo:", DarkPalette.gold);
          EOF
          node test-resolution.mjs
          npx expo export --platform web
