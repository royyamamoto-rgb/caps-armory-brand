name: release
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (alpha|beta|latest)"
        required: true
        default: "alpha"
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pre-publish gates
        run: |
          pnpm test
          pnpm test:tarball
          pnpm drift-check
        env:
          THEMES_READ_PAT: ${{ secrets.THEMES_READ_PAT }}

      - name: Enforce alpha dist-tag for 0.x prereleases
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-alpha* && "${{ inputs.dist_tag }}" != "alpha" ]]; then
            echo "Version $version is alpha but dist_tag is ${{ inputs.dist_tag }}; refusing."
            exit 1
          fi

      - name: changesets version + publish
        run: |
          # If a pre-release version has already been baked locally and pushed
          # (Task 29 workflow), skip the version step — the package.json + changelog
          # are already in their published shape. Otherwise call `changeset version`.
          if [ -n "$(ls .changeset/*.md 2>/dev/null | grep -v README.md || true)" ]; then
            pnpm changeset version
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "release: $(node -p "require('./package.json').version")" || true
            git push origin main || true
          fi
          pnpm changeset publish --tag ${{ inputs.dist_tag }} --provenance
