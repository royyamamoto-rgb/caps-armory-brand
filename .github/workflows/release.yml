name: release
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (alpha|beta|latest)"
        required: true
        default: "alpha"
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pre-publish gates
        run: |
          pnpm test
          pnpm test:tarball
          pnpm drift-check
        env:
          THEMES_READ_PAT: ${{ secrets.THEMES_READ_PAT }}

      - name: Enforce alpha dist-tag for 0.x prereleases
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-alpha* && "${{ inputs.dist_tag }}" != "alpha" ]]; then
            echo "Version $version is alpha but dist_tag is ${{ inputs.dist_tag }}; refusing."
            exit 1
          fi

      - name: changesets publish
        run: |
          # The version was already baked locally (Task 29: `changeset version` in
          # pre-alpha mode produced 0.0.1-alpha.0). In pre mode the tag is implicit
          # from .changeset/pre.json#tag — passing --tag explicitly is rejected.
          # We also drop --provenance until npm trusted-publisher is configured.
          pnpm changeset publish --no-git-tag
